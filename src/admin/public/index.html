<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cheki Admin</title>
<style>
  :root {
    color-scheme: light dark;
    --ground:#f4f6f9; --surface:#ffffff; --surface-2:#fafbfc; --side:#ffffff;
    --border:#e5e8ef; --border-strong:#d3d8e2;
    --ink:#171a22; --ink-2:#3d4353; --muted:#6b7385; --faint:#9aa1b2;
    --accent:#6f5fd9; --accent-ink:#ffffff; --accent-soft:#efecfb;
    --ok:#0f8a4d; --warn:#b7791f; --sold:#d1425c; --draft:#8a93a3;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 4px 16px rgba(20,25,40,.05);
    --shadow-lg:0 10px 40px rgba(20,25,40,.18);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0a0c11; --surface:#14171e; --surface-2:#171b23; --side:#0e1116;
      --border:#242a35; --border-strong:#333b48;
      --ink:#e8eaf1; --ink-2:#c3c8d4; --muted:#8b93a4; --faint:#616a7c;
      --accent:#a595f7; --accent-ink:#0b0d12; --accent-soft:#211f3a;
      --ok:#3bce86; --warn:#e0a84a; --sold:#f0637d; --draft:#7b8494;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
      --shadow-lg:0 12px 44px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"] {
    --ground:#f4f6f9; --surface:#ffffff; --surface-2:#fafbfc; --side:#ffffff;
    --border:#e5e8ef; --border-strong:#d3d8e2; --ink:#171a22; --ink-2:#3d4353;
    --muted:#6b7385; --faint:#9aa1b2; --accent:#6f5fd9; --accent-ink:#ffffff;
    --accent-soft:#efecfb; --ok:#0f8a4d; --warn:#b7791f; --sold:#d1425c; --draft:#8a93a3;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 4px 16px rgba(20,25,40,.05);
    --shadow-lg:0 10px 40px rgba(20,25,40,.18);
  }
  :root[data-theme="dark"] {
    --ground:#0a0c11; --surface:#14171e; --surface-2:#171b23; --side:#0e1116;
    --border:#242a35; --border-strong:#333b48; --ink:#e8eaf1; --ink-2:#c3c8d4;
    --muted:#8b93a4; --faint:#616a7c; --accent:#a595f7; --accent-ink:#0b0d12;
    --accent-soft:#211f3a; --ok:#3bce86; --warn:#e0a84a; --sold:#f0637d; --draft:#7b8494;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
    --shadow-lg:0 12px 44px rgba(0,0,0,.5);
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink);
         font-family:var(--font); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  .app { display:flex; min-height:100vh; align-items:stretch; }

  .sidebar { width:236px; flex:0 0 236px; background:var(--side); border-right:1px solid var(--border);
             display:flex; flex-direction:column; gap:6px; padding:16px 14px; position:sticky; top:0; height:100vh; }
  .side-top { display:flex; align-items:center; gap:10px; }
  .logo-plate { background:#fbfbfe; border:1px solid var(--border); border-radius:12px; padding:12px;
                display:flex; align-items:center; justify-content:center; min-height:76px; margin-bottom:8px; flex:1; }
  .logo-plate img { max-width:100%; max-height:64px; display:block; }
  .logo-fallback { display:none; align-items:center; gap:2px; font-weight:750; letter-spacing:.02em; color:#2b2e3d; font-size:19px; }
  .logo-fallback b { color:var(--accent); }
  .hamburger { display:none; align-items:center; justify-content:center; width:38px; height:36px; flex:0 0 auto;
               border:1px solid var(--border-strong); background:var(--surface); border-radius:9px; cursor:pointer; font-size:16px; color:var(--ink-2); }
  .side-title { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; padding:8px 8px 4px; }
  .navlist { display:flex; flex-direction:column; gap:3px; overflow-y:auto; flex:1; }
  .nav-item { display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--radius-sm);
              cursor:pointer; color:var(--ink-2); border:1px solid transparent; }
  .nav-item:hover { background:var(--surface-2); }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav-item .dot { width:7px; height:7px; border-radius:50%; background:var(--draft); flex:0 0 auto; }
  .nav-item.st-live .dot,.nav-item.st-scheduled .dot,.nav-item.st-teasing .dot { background:var(--ok); }
  .nav-item.st-done .dot { background:var(--accent); } .nav-item.st-cancelled .dot { background:var(--sold); }
  .nav-item .label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
  .create-wrap { padding:4px 2px 8px; }
  .btn-create { width:100%; display:flex; align-items:center; justify-content:center; gap:6px;
                border:1px dashed var(--border-strong); background:transparent; color:var(--accent);
                padding:9px; border-radius:var(--radius-sm); cursor:pointer; font:inherit; font-size:13px; font-weight:600; }
  .btn-create:hover { background:var(--accent-soft); border-style:solid; }
  .side-note { font-size:12px; color:var(--faint); padding:8px; line-height:1.5; }
  .side-note code { font-family:var(--mono); background:var(--surface-2); padding:1px 5px; border-radius:5px; }
  .conn { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); padding:8px; border-top:1px solid var(--border); }
  .conn .led { width:8px; height:8px; border-radius:50%; background:var(--faint); transition:.2s; }
  .conn.ok .led { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%, transparent); }
  .conn.bad .led { background:var(--sold); box-shadow:0 0 0 3px color-mix(in srgb,var(--sold) 20%, transparent); }

  .main { flex:1; min-width:0; padding:22px 26px 48px; max-width:1060px; }
  #err { color:var(--sold); font-size:13px; margin-bottom:12px; min-height:1px; }

  .drop-head { display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .drop-head h1 { font-size:22px; margin:0; letter-spacing:-.02em; display:flex; align-items:center; gap:8px; }
  .icon-btn { border:0; background:transparent; color:var(--faint); cursor:pointer; padding:4px; border-radius:6px; font-size:15px; }
  .icon-btn:hover { color:var(--accent); background:var(--accent-soft); }
  .pill { font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap;
          text-transform:uppercase; letter-spacing:.03em; }
  .pill.state { background:var(--accent-soft); color:var(--accent); }
  .chip { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--border-strong); color:var(--muted); }

  .chanrow { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:16px 0 4px;
             padding:11px 13px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .chanrow .lab { font-size:12px; color:var(--muted); }
  .chanrow b { font-family:var(--mono); font-size:13px; color:var(--accent); }
  .chanrow input { font:inherit; font-size:13px; padding:6px 10px; border-radius:var(--radius-sm);
                   border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink);
                   font-family:var(--mono); width:190px; max-width:48vw; }
  .chanrow input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 20px; }
  button { font:inherit; font-size:13px; font-weight:550; padding:8px 13px; border-radius:var(--radius-sm);
           border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); cursor:pointer;
           transition:border-color .12s, background .12s, transform .04s; }
  button:hover { border-color:var(--faint); background:var(--surface-2); }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  button.primary:hover { filter:brightness(1.06); background:var(--accent); }
  button.ghost-danger:hover { border-color:var(--sold); color:var(--sold); }

  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:0 0 22px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
  .kpi .k-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .kpi .k-val { margin-top:6px; font-size:23px; font-weight:680; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .kpi .k-sub { font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { position:relative; background:var(--surface); border:1px solid var(--border);
          border-radius:var(--radius); padding:16px 16px 14px 18px; box-shadow:var(--shadow); overflow:hidden; }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--stripe,var(--draft)); }
  .card.s-available { --stripe:var(--ok); } .card.s-reserved { --stripe:var(--warn); }
  .card.s-sold { --stripe:var(--sold); } .card.s-draft { --stripe:var(--draft); }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .card-head .code { font-size:17px; font-weight:700; letter-spacing:-.01em; }
  .card-head .code small { font-weight:500; color:var(--muted); font-size:13px; margin-left:6px; }
  .head-right { display:flex; align-items:center; gap:6px; }
  .pill.s-available { color:var(--ok); background:color-mix(in srgb,var(--ok) 13%, transparent); }
  .pill.s-reserved { color:var(--warn); background:color-mix(in srgb,var(--warn) 15%, transparent); }
  .pill.s-sold { color:var(--sold); background:color-mix(in srgb,var(--sold) 13%, transparent); }
  .pill.s-draft { color:var(--draft); background:color-mix(in srgb,var(--draft) 15%, transparent); }

  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 10px; }
  dl dt { font-size:12px; color:var(--muted); }
  dl dd { margin:0; text-align:right; font-size:13px; color:var(--ink-2); font-weight:500;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  dl dd.mono { font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; }
  dl dd.price { font-family:var(--mono); font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  dl dd.chan { color:var(--accent); font-weight:600; }

  .sep { height:1px; background:var(--border); margin:13px 0 12px; }
  .track { display:flex; gap:8px; align-items:center; }
  .track input { flex:1 1 90px; min-width:0; font:inherit; font-size:13px; padding:8px 11px;
                 border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink); }
  .track input::placeholder { color:var(--faint); }
  .track input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .track button { white-space:nowrap; }
  .sent { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:10px; }
  .sent .no { font-family:var(--mono); color:var(--ok); font-weight:600;
              background:color-mix(in srgb,var(--ok) 12%, transparent); padding:2px 8px; border-radius:6px; }

  /* live preview of the Discord tracking embed */
  .embed-prev { margin-top:11px; }
  .embed-prev[hidden] { display:none; }
  .ep-ping { font-size:11px; color:var(--muted); margin-bottom:6px; }
  .ep-ping b { color:var(--accent); }
  .ep-card { display:flex; gap:10px; background:var(--surface-2); border:1px solid var(--border);
             border-left:4px solid var(--ok); border-radius:6px; padding:10px 12px; }
  .ep-body { flex:1; min-width:0; }
  .ep-title { font-weight:700; font-size:13.5px; margin-bottom:4px; }
  .ep-desc { font-size:12.5px; color:var(--ink-2); margin-bottom:8px; line-height:1.4; }
  .ep-flabel { font-size:11px; font-weight:700; color:var(--ink); }
  .ep-track { display:inline-block; margin-top:4px; font-family:var(--mono); font-size:12px; color:var(--ink);
              background:var(--ground); border:1px solid var(--border); border-radius:5px; padding:4px 9px; word-break:break-all; }
  .ep-footer { font-size:11px; color:var(--faint); margin-top:9px; }
  .ep-thumb { width:56px; height:56px; object-fit:cover; border-radius:6px; flex:0 0 auto; background:var(--ground); }
  .ep-carrier { font-weight:600; }
  .ep-link { display:inline-block; margin-top:9px; font-size:12px; font-weight:600; color:var(--ink-2);
             background:var(--ground); border:1px solid var(--border-strong); border-radius:6px; padding:5px 11px; }
  .ep-link[hidden] { display:none; }
  .ep-recipient { font-size:12.5px; color:var(--ink-2); margin-bottom:6px; font-weight:600; }
  .ep-recipient[hidden] { display:none; }
  .rn.saved { border-color:var(--ok) !important; }

  .carrier-pick { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .carrier-btn { display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12px; padding:5px 10px;
                 border-radius:999px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .carrier-btn .sw { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .carrier-btn:hover { border-color:var(--faint); }
  .carrier-btn.active { border-color:var(--cc); background:color-mix(in srgb,var(--cc) 13%, transparent); color:var(--ink); font-weight:600; }

  .empty { color:var(--muted); padding:56px 20px; text-align:center; background:var(--surface);
           border:1px dashed var(--border-strong); border-radius:var(--radius); }

  /* modal */
  .modal-backdrop { position:fixed; inset:0; background:rgba(10,12,18,.5); display:flex;
                    align-items:center; justify-content:center; padding:18px; z-index:50; }
  .modal-backdrop[hidden] { display:none; }
  .modal { width:100%; max-width:440px; max-height:90vh; overflow:auto; background:var(--surface);
           border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-lg); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
  .modal-head span { font-size:16px; font-weight:650; }
  .modal-body { padding:6px 18px 4px; display:flex; flex-direction:column; gap:12px; }
  .modal-foot { display:flex; justify-content:flex-end; gap:8px; padding:14px 18px 18px; }
  .fld { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); font-weight:600; }
  .fld input, .fld textarea { font:inherit; font-size:14px; color:var(--ink); font-weight:400;
      padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface-2); }
  .fld input:focus-visible, .fld textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .fld textarea { resize:vertical; }
  .ok-tag { color:var(--ok); font-weight:600; }
  .img-prev { max-width:100%; max-height:220px; margin-top:2px; display:block; border-radius:8px;
              border:1px solid var(--border); object-fit:contain; background:var(--ground); }
  .img-prev[hidden] { display:none; }

  /* magnifier + sale-message (public embed) preview */
  .card-foot { display:flex; justify-content:flex-end; margin-top:11px; }
  .mag { font:inherit; font-size:12px; padding:5px 10px; border-radius:8px; border:1px solid var(--border-strong);
         background:transparent; color:var(--muted); cursor:pointer; }
  .mag:hover { border-color:var(--accent); color:var(--accent); }
  .sale-embed { background:var(--surface-2); border:1px solid var(--border); border-left:4px solid var(--draft);
                border-radius:6px; padding:12px 14px; }
  .se-title { font-weight:700; font-size:15px; margin-bottom:8px; }
  .se-desc { font-size:13px; color:var(--ink-2); margin-bottom:8px; }
  .se-fields { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:10px; }
  .se-flabel { font-size:11px; font-weight:700; color:var(--ink); }
  .se-fval { font-size:13px; color:var(--ink-2); margin-top:2px; }
  .se-img { width:100%; max-height:340px; object-fit:contain; border-radius:6px; background:var(--ground); display:block; }
  .se-noimg { padding:28px; text-align:center; color:var(--faint); border:1px dashed var(--border-strong); border-radius:6px; }
  .se-footer { font-size:11px; color:var(--faint); margin-top:9px; }
  .se-btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .se-btn { font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:6px; border:0; color:#fff; opacity:.9; cursor:default; }
  .se-btn.green { background:#3ba55d; } .se-btn.gray { background:#4f545c; } .se-btn.red { background:#ed4245; }
  .se-btn[disabled] { opacity:.5; }
  .se-note { font-size:11px; color:var(--faint); margin-top:11px; }

  @media (max-width:820px){
    .app{ flex-direction:column; }
    .sidebar{ width:auto; flex:none; height:auto; position:sticky; top:0; z-index:20;
              flex-direction:row; align-items:center; flex-wrap:wrap; gap:10px;
              border-right:0; border-bottom:1px solid var(--border); }
    .side-top{ flex:1; }
    .logo-plate{ min-height:0; padding:7px 12px; margin:0; }
    .logo-plate img{ max-height:32px; }
    .hamburger{ display:inline-flex; }
    .conn{ border-top:0; padding:0; margin-left:auto; }
    .side-title,.navlist,.side-note,.create-wrap{ display:none; width:100%; }
    .sidebar.open .side-title,.sidebar.open .navlist,.sidebar.open .side-note,.sidebar.open .create-wrap{ display:flex; }
    .sidebar.open .navlist{ flex-direction:column; }
    .main{ padding:16px 14px 40px; }
    .kpis{ grid-template-columns:repeat(2,1fr); }
    .drop-head h1{ font-size:19px; }
    .chanrow input{ width:100%; max-width:none; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-top">
      <button class="hamburger" onclick="toggleNav()" aria-label="เมนู">☰</button>
      <div class="logo-plate">
        <img src="/logo.png" alt="RLanz" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="logo-fallback">R<b>Lanz</b></span>
      </div>
    </div>
    <div class="side-title">ดรอปทั้งหมด</div>
    <nav class="navlist" id="navlist"><div class="side-note">กำลังโหลด…</div></nav>
    <div class="create-wrap"><button class="btn-create" onclick="openCreateDrop()">＋ ดรอปใหม่</button></div>
    <div class="side-note">หรือพิมพ์ <code>/cheki init</code> ในดิสก์ก็ได้</div>
    <div class="conn" id="conn"><span class="led"></span> <span id="connlabel">กำลังเชื่อมต่อ…</span></div>
  </aside>
  <main class="main">
    <div id="err"></div>
    <div id="content"><div class="empty">กำลังโหลด…</div></div>
  </main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal">
    <div class="modal-head"><span id="modal-title"></span><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot"><button onclick="closeModal()">ยกเลิก</button><button class="primary" id="modal-save">บันทึก</button></div>
  </div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token');
const headers = () => (TOKEN ? { 'X-Admin-Token': TOKEN } : {});
if (TOKEN) history.replaceState(null, '', location.pathname); // drop token from URL (cookie holds it)

async function api(path, method='GET', body=null){
  const opts={ method, headers:{ ...headers() } };
  if (body){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (res.status===401) throw new Error('ไม่มีสิทธิ์เข้าถึง (401) — ตรวจ token / Access');
  if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || res.statusText);
  return res.json();
}

const LABEL={ available:'ว่าง', reserved:'จ่ายเงิน', sold:'ขายแล้ว', draft:'ร่าง' };
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baht=(s)=>'฿'+((s||0)/100).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const val=(id)=>{ const el=document.getElementById(id); return el?el.value.trim():''; };

let currentId = Number(localStorage.getItem('chekiDrop')) || null;
let itemsById = {};
let CARRIERS = [];               // [{id,name,hex}]
const carrierById = {};
const pickedCarrier = {};        // itemId -> carrierId (user selection, persists across refresh)

async function loadCarriers(){
  try{
    const { carriers } = await api('/api/carriers');
    CARRIERS = carriers || [];
    CARRIERS.forEach(c=>{ carrierById[c.id]=c; });
  }catch(e){ CARRIERS=[]; }
}

function toggleNav(){ document.querySelector('.sidebar').classList.toggle('open'); }
function setConn(state,label){
  document.getElementById('conn').className='conn'+(state?' '+state:'');
  document.getElementById('connlabel').textContent=label;
}

function renderNav(drops){
  const nav=document.getElementById('navlist');
  if(!drops.length){ nav.innerHTML='<div class="side-note">ยังไม่มีดรอป</div>'; return; }
  nav.innerHTML = drops.map(d=>
    `<div class="nav-item st-${d.state} ${d.id===currentId?'active':''}" onclick="selectDrop(${d.id})">
       <span class="dot"></span><span class="label">${esc(d.displayName)}</span></div>`).join('');
}

function kpiHtml(items){
  const rev=items.filter(i=>i.status==='sold').reduce((a,i)=>a+(i.priceSatang||0),0);
  const sold=items.filter(i=>i.status==='sold').length;
  const sent=items.filter(i=>i.trackingNo).length;
  const queue=items.reduce((a,i)=>a+(i.queueCount||0),0);
  const t=[{label:'รายได้รวม',val:baht(rev),sub:sold+' ออเดอร์'},
    {label:'ขายแล้ว',val:sold+'/'+items.length,sub:'ทั้งดรอป'},
    {label:'ส่งพัสดุแล้ว',val:sent+'/'+sold,sub:Math.max(0,sold-sent)+' รอส่งเลขแทร็ก'},
    {label:'อยู่ในคิว',val:String(queue),sub:'คนรอทั้งหมด'}];
  return `<div class="kpis">${t.map(k=>`<div class="kpi"><div class="k-label">${esc(k.label)}</div><div class="k-val">${esc(k.val)}</div><div class="k-sub">${esc(k.sub)}</div></div>`).join('')}</div>`;
}

const chanLabel=(id,name)=> name?'#'+esc(name):(id?'#'+esc(id):'—');

function embedPreviewHtml(it){
  const buyer=it.currentBuyerId||it.buyerUserId||'ผู้ซื้อ';
  const chan=it.channelName?('#'+esc(it.channelName)):(it.channelId?('#'+esc(it.channelId)):'ห้องผู้ซื้อ');
  const thumb=it.hasImage?`<img class="ep-thumb" src="/api/items/${it.id}/image" alt="" onerror="this.remove()">`:'';
  return `<div class="embed-prev" id="ep-${it.id}" hidden>
    <div class="ep-ping">📢 จะแจ้งถึง <b>@${esc(buyer)}</b> · ห้อง ${chan}</div>
    <div class="ep-card">
      <div class="ep-body">
        <div class="ep-title">📦 พัสดุจัดส่งแล้ว!</div>
        <div class="ep-desc">เชกิลายที่ ${it.slot}${it.title?(' — '+esc(it.title)):''} ออกเดินทางแล้ว 🚚<br><span class="ep-carrier"></span><br>ขอบคุณที่อุดหนุนนะคะ 💖</div>
        <div class="ep-recipient" hidden></div>
        <div class="ep-flabel">เลขติดตามพัสดุ</div><div><code class="ep-track"></code></div>
        <div class="ep-link" hidden></div>
        <div class="ep-footer">Rlanz CAFÉ</div>
      </div>${thumb}
    </div>
  </div>`;
}
function updatePreview(id){
  const inp=document.getElementById('tk-'+id), ep=document.getElementById('ep-'+id);
  if(!inp||!ep) return;
  const v=(inp.value||'').trim();
  if(!v){ ep.hidden=true; return; }
  ep.hidden=false;
  ep.querySelector('.ep-track').textContent=v;
  const rn=document.getElementById('rn-'+id);
  const rname=((rn&&rn.value)||'').trim();
  const recEl=ep.querySelector('.ep-recipient');
  if(recEl){ if(rname){ recEl.hidden=false; recEl.textContent='📮 ผู้รับ: '+rname; } else { recEl.hidden=true; } }
  const c=carrierById[pickedCarrier[id]];
  const epcard=ep.querySelector('.ep-card'), carLine=ep.querySelector('.ep-carrier'), link=ep.querySelector('.ep-link');
  if(c){
    if(epcard) epcard.style.borderLeftColor=c.hex;
    if(carLine) carLine.textContent='ขนส่ง: '+c.name;
    if(link){ link.hidden=false; link.textContent='🔎 ตรวจสถานะ ('+c.name+')'; }
  } else {
    if(carLine) carLine.textContent='';
    if(link) link.hidden=true;
  }
}
function pickCarrier(id,cid){
  pickedCarrier[id]=cid;
  const wrap=document.getElementById('cp-'+id);
  if(wrap) wrap.querySelectorAll('.carrier-btn').forEach(b=>b.classList.toggle('active', b.dataset.c===cid));
  updatePreview(id);
}
function carrierPickHtml(it){
  if(!CARRIERS.length) return '';
  return `<div class="carrier-pick" id="cp-${it.id}">${CARRIERS.map(c=>
    `<button type="button" class="carrier-btn ${pickedCarrier[it.id]===c.id?'active':''}" data-c="${c.id}" style="--cc:${c.hex}" onclick="pickCarrier(${it.id},'${c.id}')"><span class="sw" style="background:${c.hex}"></span>${esc(c.name)}</button>`
  ).join('')}</div>`;
}

function card(it){
  const buyer=it.currentBuyerId||it.buyerUserId;
  let block;
  if(it.status==='sold'){
    if(!(it.id in pickedCarrier)) pickedCarrier[it.id]= it.trackingCarrier || (CARRIERS[0]&&CARRIERS[0].id) || null;
    const sent=it.trackingNo?`<div class="sent">ส่งเลขแทร็กแล้ว <span class="no">${esc(it.trackingNo)}</span>${it.trackingCarrier&&carrierById[it.trackingCarrier]?(' · '+esc(carrierById[it.trackingCarrier].name)):''}${it.recipientName?(' · ถึง '+esc(it.recipientName)):''}</div>`:'';
    block=`${sent}
      <div class="track"><input id="rn-${it.id}" class="rn" placeholder="ชื่อผู้รับ (สำหรับจัดส่ง)" value="${esc(it.recipientName||'')}" oninput="updatePreview(${it.id})"><button onclick="saveRecipient(${it.id})">บันทึกชื่อ</button></div>
      ${carrierPickHtml(it)}
      <div class="track"><input id="tk-${it.id}" placeholder="${it.trackingNo?'แก้ / ส่งซ้ำ…':'เลขติดตามพัสดุ…'}" oninput="updatePreview(${it.id})"><button class="primary" onclick="track(${it.id})">📦 ${it.trackingNo?'ส่งซ้ำ':'ส่งเลขแทร็ก'}</button></div>
      ${embedPreviewHtml(it)}`;
  } else {
    block=`<div class="track"><button class="ghost-danger" onclick="act('/api/items/${it.id}/release','ข้ามคิว #1 ของ ${esc(it.title||('ลาย '+it.slot))}?')">⏭️ ปล่อยคิว / ข้าม #1</button></div>`;
  }
  return `<div class="card s-${it.status}">
    <div class="card-head">
      <span class="code">${esc(it.title||('ลาย '+it.slot))}<small>ลาย ${it.slot}</small></span>
      <span class="head-right">
        <button class="icon-btn" title="แก้ไขลาย" onclick="openEditItem(${it.id})">✎</button>
        <span class="pill s-${it.status}">${esc(it.statusLabel||LABEL[it.status]||it.status)}</span>
      </span>
    </div>
    <dl>
      <dt>ราคา</dt><dd class="price">${esc(it.price||baht(it.priceSatang))}</dd>
      <dt>รูป</dt><dd>${it.hasImage?'มีแล้ว ✓':'— ยังไม่มี'}</dd>
      <dt>คิว</dt><dd>${it.queueCount} คน</dd>
      <dt>ห้องชำระเงิน</dt><dd class="chan mono" title="${esc(it.channelId||'')}">${chanLabel(it.channelId,it.channelName)}</dd>
      <dt>ผู้ซื้อ</dt><dd class="mono" title="${esc(buyer||'')}">${buyer?esc(buyer):'—'}</dd>
    </dl>
    <div class="sep"></div>${block}
    <div class="card-foot"><button class="mag" title="พรีวิวข้อความขายใน Discord" onclick="previewSale(${it.id})">🔍 พรีวิว</button></div>
  </div>`;
}

function renderDrop(d){
  const el=document.getElementById('content');
  if(!d){ el.innerHTML='<div class="empty">เลือกดรอปจากเมนู หรือกด ＋ ดรอปใหม่</div>'; return; }
  itemsById={}; d.items.forEach(it=>{ itemsById[it.id]=it; });
  el.innerHTML=`
    <div class="drop-head">
      <h1>${esc(d.displayName)}<button class="icon-btn" title="เปลี่ยนชื่อดรอป" onclick="renameDrop(${d.id})">✎</button></h1>
      <span class="pill state">${esc(d.state)}</span>
      ${d.publishAtText?`<span class="chip">เปิดขาย ${esc(d.publishAtText)}</span>`:''}
    </div>
    <div class="chanrow">
      <span class="lab">ห้องประกาศดรอปนี้:</span>
      <b>${chanLabel(d.announceChannelId,d.announceChannelName)}</b>
      <input id="dropchan" placeholder="วาง ID ห้อง Text Channel…" value="${esc(d.announceChannelId||'')}">
      <button onclick="setChannel(${d.id})">บันทึกห้อง</button>
    </div>
    <div class="toolbar">
      <button class="primary" onclick="act('/api/drops/${d.id}/reveal','เปิดขาย ${esc(d.displayName)} เดี๋ยวนี้เลย?')">🚀 เปิดขายตอนนี้</button>
      <button class="ghost-danger" onclick="act('/api/drops/${d.id}/cancel','ยกเลิก ${esc(d.displayName)}?')">ยกเลิกดรอป</button>
      <button class="ghost-danger" onclick="act('/api/drops/${d.id}/cleanup','ลบห้องชำระเงินทั้งหมด? (ข้อมูลออเดอร์ยังอยู่)')">ลบห้องทั้งหมด</button>
      <button onclick="reloadAll()">↻ รีเฟรช</button>
    </div>
    ${kpiHtml(d.items)}
    <div class="grid">${d.items.map(card).join('')}</div>`;
}

async function selectDrop(id){ currentId=id; localStorage.setItem('chekiDrop',id); document.querySelector('.sidebar').classList.remove('open'); await reloadAll(); }

async function renameDrop(id){
  const name=prompt('ตั้งชื่อดรอป (เช่น "Stelle - Drop"):','');
  if(name===null) return;
  try{ await api('/api/drops/'+id,'PATCH',{name}); await reloadAll(); }catch(e){ showErr(e.message); }
}
async function setChannel(id){
  const v=(document.getElementById('dropchan').value||'').trim();
  try{ await api('/api/drops/'+id,'PATCH',{announceChannelId:v}); await reloadAll(); }catch(e){ showErr(e.message); }
}
async function act(path,msg){ if(!confirm(msg))return; try{ await api(path,'POST'); await reloadAll(); }catch(e){ showErr(e.message); } }
async function track(id){
  const el=document.getElementById('tk-'+id); const v=(el.value||'').trim();
  if(!v){ showErr('ใส่เลขติดตามพัสดุก่อน'); el.focus(); return; }
  const c=carrierById[pickedCarrier[id]];
  const rn=document.getElementById('rn-'+id); const recipient=((rn&&rn.value)||'').trim();
  if(!confirm(`ส่งเลขแทร็ก "${v}"${c?(' ('+c.name+')'):''}${recipient?(' ถึง '+recipient):''} ไปหาผู้ซื้อในห้องของเขา?`)) return;
  try{ await api('/api/items/'+id+'/track','POST',{trackingNo:v, carrier:pickedCarrier[id]||null, recipient}); await reloadAll(); }catch(e){ showErr(e.message); }
}
async function saveRecipient(id){
  const rn=document.getElementById('rn-'+id); const v=((rn&&rn.value)||'').trim();
  try{
    await api('/api/items/'+id+'/order','PATCH',{recipient:v});
    if(itemsById[id]) itemsById[id].recipientName=v||null;
    rn.classList.add('saved'); setTimeout(()=>rn.classList.remove('saved'),1200);
  }catch(e){ showErr(e.message); }
}

// --- modal / create / edit ---
function openModal(title, bodyHtml, onSave){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=bodyHtml;
  const save=document.getElementById('modal-save'); save.style.display=''; save.onclick=onSave;
  document.getElementById('modal').hidden=false;
}
function openPreview(title, bodyHtml){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=bodyHtml;
  document.getElementById('modal-save').style.display='none';   // read-only: no save button
  document.getElementById('modal').hidden=false;
}
function closeModal(){ document.getElementById('modal').hidden=true; }

// Mock of the public sale embed (what buyers see in Discord) — mirrors embedService.
const EMBED_STATUS={ available:{emoji:'🟢',label:'ว่าง (เปิดจอง)',color:'#57f287'},
  reserved:{emoji:'🟡',label:'กำลังชำระเงิน',color:'#fee75c'},
  sold:{emoji:'🔴',label:'ขายแล้ว',color:'#ed4245'},
  draft:{emoji:'⚪',label:'ยังไม่เปิดขาย',color:'#99aab5'} };
function saleFooter(s){
  if(s==='sold') return 'ปิดการขายแล้ว ขอบคุณค่ะ 💖';
  if(s==='reserved') return 'มีผู้ซื้อกำลังชำระเงิน — กดจองเพื่อต่อคิวสำรองได้';
  return 'กด "จอง" เพื่อเข้าคิว · คิวแรกที่ยืนยันได้สิทธิ์ซื้อ';
}
function saleEmbedHtml(it){
  const m=EMBED_STATUS[it.status]||EMBED_STATUS.draft;
  const dis=it.status==='sold'?'disabled':'';
  const img=it.hasImage?`<img class="se-img" src="/api/items/${it.id}/image?t=${Date.now()}" alt="">`:'<div class="se-noimg">— ยังไม่มีรูป (อัปรูปก่อนเปิดขาย) —</div>';
  return `<div class="sale-embed" style="border-left-color:${m.color}">
    <div class="se-title">เชกิลายที่ ${it.slot}${it.title?(' — '+esc(it.title)):''}</div>
    ${it.description?`<div class="se-desc">${esc(it.description)}</div>`:''}
    <div class="se-fields">
      <div><div class="se-flabel">ราคา</div><div class="se-fval">${esc(it.price||'-')}</div></div>
      <div><div class="se-flabel">สถานะ</div><div class="se-fval">${m.emoji} ${esc(m.label)}</div></div>
      <div><div class="se-flabel">คิว</div><div class="se-fval">${it.queueCount} คน</div></div>
    </div>
    ${img}
    <div class="se-footer">${saleFooter(it.status)}</div>
  </div>
  <div class="se-btns">
    <button class="se-btn green" ${dis}>🎟️ จอง</button>
    <button class="se-btn gray" ${dis}>🔢 เช็คคิว</button>
    <button class="se-btn red" ${dis}>✖️ ยกเลิกการจอง</button>
  </div>
  <div class="se-note">* ตัวอย่างเท่านั้น — ปุ่มจริงจะกดได้ในห้องประกาศตอนเปิดขาย${it.status==='sold'?' (ลายนี้ปิดการขายแล้ว ปุ่มถูกปิด)':''}</div>`;
}
function previewSale(id){ const it=itemsById[id]; if(it) openPreview('พรีวิวข้อความขาย (Discord)', saleEmbedHtml(it)); }

function openCreateDrop(){
  openModal('สร้างดรอปใหม่',
    `<label class="fld">ชื่อดรอป<input id="f-name" placeholder="เช่น Stelle - Drop"></label>
     <label class="fld">จำนวนลาย (1–20)<input id="f-count" type="number" min="1" max="20" value="5"></label>`,
    createDrop);
}
async function createDrop(){
  try{
    const { drop } = await api('/api/drops','POST',{ name:val('f-name'), count:Number(val('f-count'))||5 });
    currentId=drop.id; localStorage.setItem('chekiDrop',drop.id);
    closeModal(); await reloadAll();
  }catch(e){ showErr(e.message); }
}

function openEditItem(id){
  const it=itemsById[id]; if(!it) return;
  openModal(`แก้ไข ${esc(it.title||('ลาย '+it.slot))}`,
    `<label class="fld">ชื่อลาย<input id="f-title" value="${esc(it.title||'')}" placeholder="เช่น R1"></label>
     <label class="fld">คำอธิบาย (ไม่บังคับ)<textarea id="f-desc" rows="2">${esc(it.description||'')}</textarea></label>
     <label class="fld">ราคา (บาท)<input id="f-price" type="number" min="0" step="0.01" value="${it.priceSatang!=null?it.priceSatang/100:''}" placeholder="250"></label>
     <label class="fld">รูปเชกิ ${it.hasImage?'<span class="ok-tag">มีรูปแล้ว ✓</span>':''}<input id="f-image" type="file" accept="image/*" onchange="previewFile()"></label>
     <img id="f-img-prev" class="img-prev" ${it.hasImage?`src="/api/items/${id}/image?t=${Date.now()}"`:'hidden'} alt="ตัวอย่างรูปเชกิ">`,
    ()=>saveItem(id));
}
function previewFile(){
  const inp=document.getElementById('f-image'), img=document.getElementById('f-img-prev');
  const f=inp&&inp.files&&inp.files[0];
  if(!f||!img) return;
  img.src=URL.createObjectURL(f); img.hidden=false;
}
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function saveItem(id){
  const file=document.getElementById('f-image').files[0];
  try{
    await api('/api/items/'+id,'PATCH',{ title:val('f-title'), description:val('f-desc'), priceBaht:val('f-price') });
    if(file){ await api('/api/items/'+id+'/image','POST',{ filename:file.name, dataBase64:await fileToB64(file) }); }
    closeModal(); await reloadAll();
  }catch(e){ showErr(e.message); }
}

async function reloadAll(){
  try{
    const { drops } = await api('/api/drops');
    if(!drops.length){ renderNav([]); renderDrop(null); setConn('ok','เชื่อมต่อแล้ว'); return; }
    if(!currentId || !drops.some(d=>d.id===currentId)) currentId=drops[0].id;
    renderNav(drops);
    const { drop } = await api('/api/drops/'+currentId);
    renderDrop(drop);
    document.getElementById('err').textContent=''; setConn('ok','เชื่อมต่อแล้ว');
  }catch(e){ showErr(e.message); setConn('bad','ขาดการเชื่อมต่อ'); }
}
function showErr(m){ document.getElementById('err').textContent='⚠️ '+m; }

loadCarriers().then(reloadAll);
setInterval(()=>{ if(document.getElementById('modal').hidden) reloadAll(); }, 15000);
</script>
</body>
